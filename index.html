<!DOCTYPE HTML>
<html>

<head>
    <title>Infinite Maze Generator</title>
    <link rel="stylesheet" href="styles.css">

    <script src="util/canvas.js" defer></script>
    <script src="util/mouse-tracker.js" defer></script>
    <script src="util/util.js" defer></script>

    <script src="cam.js" defer></script>
    <script src="infinite-maze.js" defer></script>
    <script src="bitmask.js" defer></script>

    <script src="ui.js" defer></script>

    <script src="index.js" defer></script>
</head>

<body>
    <div id="ui-container">
        <script>
            function init() {
                try {
                    initialize()
                } catch (err) {
                    window.setTimeout(init, 100);
                }
            }
            // why did i do this
            // gotta be a better way

            fetch("ui.html")
                .then(response => response.text())
                .then(data => {
                    document.getElementById("ui-container").innerHTML = data;
                    init();
                });
        </script>
    </div>

    <canvas id="canvas"></canvas>
    <canvas id="pathfind-canvas"></canvas>
</body>

</html>
